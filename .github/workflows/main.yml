name: Build Mamang Koneksi APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle" && -f "app/build.gradle" ]]; then
            project_dir="."
          else
            settings_file="$(find . -type f -name settings.gradle -not -path './.git/*' -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: settings.gradle tidak ditemukan. Pastikan folder project Android diunggah ke repository."
              exit 1
            fi
            project_dir="$(dirname "$settings_file")"
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Android project: $project_dir"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build error summary
        if: failure()
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          {
            echo '## Build gagal - ringkasan error'
            echo '```text'
            if [[ -f build.log ]]; then
              grep -n -E 'What went wrong|Execution failed|FAILURE:|Could not|error:|^e: |AAPT|Unresolved reference' -A4 build.log | head -n 80 || tail -n 80 build.log
            else
              echo 'Log build belum tersedia.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mamang-Koneksi-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
