name: Build Mamang Koneksi APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP files if needed
        shell: bash
        run: |
          set -euo pipefail
          extract_dir="$RUNNER_TEMP/mk-project-extracted"
          mkdir -p "$extract_dir"
          while IFS= read -r -d '' archive; do
            echo "Extracting: $archive"
            unzip -oq "$archive" -d "$extract_dir"
          done < <(find . -type f -name '*.zip' -not -path './.git/*' -print0)
          echo "ZIP extraction complete."

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_dir=""
          for search_root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mk-project-extracted"; do
            [[ -d "$search_root" ]] || continue
            while IFS= read -r -d '' settings_file; do
              candidate="$(dirname "$settings_file")"
              if [[ -f "$candidate/app/build.gradle" || -f "$candidate/app/build.gradle.kts" ]]; then
                project_dir="$candidate"
                break 2
              fi
            done < <(find "$search_root" -type f -name settings.gradle -not -path '*/.git/*' -not -path '*/.gradle/*' -print0)
          done
          if [[ -z "$project_dir" ]]; then
            echo "ERROR: Folder project Android tidak ditemukan. Upload folder hasil ekstrak ZIP atau simpan ZIP proyek di repository."
            echo "File yang tersedia di repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -n 80
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Android project ditemukan: $project_dir"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build error summary
        if: failure() && steps.project.outputs.dir != ''
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          {
            echo '## Build gagal - ringkasan error'
            echo '```text'
            if [[ -f build.log ]]; then
              grep -n -E 'What went wrong|Execution failed|FAILURE:|Could not|error:|^e: |AAPT|Unresolved reference' -A4 build.log | head -n 80 || tail -n 80 build.log
            else
              echo 'Log build belum tersedia.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mamang-Koneksi-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
